<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<body>

    <div id="token"></div>

</body>
<script>
    let win = window.open("https://abc.devmayank.com/account/login/popup", "socialpopup", "location=no")
    window.addEventListener("message", (event) => {
        console.log("Message:", event?.data);
        document.getElementById("token").innerHTML = event.data
        window.location.href = "myapp://callback?token="+event.data
    });

    const channel = new BroadcastChannel("lr-social-oauth2");
    channel.addEventListener("message", (event) => {
        if (event.data) {
            console.log("channel",event.data)
            window.location.href = "myapp://callback?token="+event.data
        }
    })

</script>

</html>
