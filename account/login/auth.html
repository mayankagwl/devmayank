<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Redirect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f5f5f5;
        }

        #message {
            background: white;
            padding: 2rem 3rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 90%;
            width: 400px;
        }

        p {
            margin: 1rem 0;
            color: #333;
            font-size: 1.1rem;
        }

        #countdown {
            color: #666;
            font-size: 1rem;
        }

        #redirectButton {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        #redirectButton:hover {
            background-color: #0056b3;
        }

        /* Loading animation */
        .loading-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div id="message">
        <p class="loading-dots">Redirecting</p>
        <p id="countdown"></p>
        <button id="redirectButton" style="display: none;">Redirect Now</button>
    </div>

    <script>
        // Get query parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const returnTo = urlParams.get('returnto') || "";
        const webview = urlParams.get('webview') === 'true';
        const token = urlParams.get('token');

        // Construct redirect URL
        const redirectUrl = `${returnTo}${returnTo.includes('?') ? '&' : '?'}token=${token}`;

        // Function to handle redirect
        function performRedirect() {
            window.location.href = redirectUrl;
        }

        // Handle redirect based on webview parameter
        if (webview) {
            let timeLeft = 5;
            const countdownElement = document.getElementById('countdown');
            const redirectButton = document.getElementById('redirectButton');
            
            // Show manual redirect button
            redirectButton.style.display = 'block';
            redirectButton.addEventListener('click', performRedirect);
            
            // Update countdown every second
            const timer = setInterval(() => {
                countdownElement.textContent = `Redirecting in ${timeLeft} seconds...`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(timer);
                    performRedirect();
                }
            }, 1000);
        } else {
            // Immediate redirect
            performRedirect();
        }
    </script>
</body>
</html>
