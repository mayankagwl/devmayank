<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<body>
    <div id="open">Login</div>
    <div id="token"></div>

</body>
<script>
    var win

    document.getElementById("open").addEventListener("click", (e) => {
        win = window.open("https://abc.devmayank.com/account/login/popup", "socialpopup", "location=no")
    })
    
    window.addEventListener("message", (event) => {
        console.log("Message:", event?.data);
        document.getElementById("token").innerHTML = event.data
        window.location.href = "myapp://callback?token="+event.data
    });

    window.addEventListener("storage", (event) => {
		if (event.key === "authToken") {
			console.log("New auth token received:", event.newValue);
			document.getElementById("token").innerHTML = event.data
			
			window.location.href = "myapp://callback?token="+event.newValue
		}
	});

    //     }

</script>

</html>
